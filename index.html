<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10263d"><title>Yöneylem Öğrenme Atölyesi V2</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#15283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#10263d;color:white;padding:24px 18px 20px}header h1{font-size:23px;margin:5px 0}header p{color:#b9d1e5;margin:0;font-size:14px}.wrap{max-width:850px;margin:auto;padding:16px}nav{display:flex;gap:8px;overflow:auto;padding-bottom:8px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:#e4eaf1;color:#19334a}button.primary{background:#1266c2;color:white}button:disabled{opacity:.45;cursor:default}.tab{white-space:nowrap}.tab.active{background:#1266c2;color:white}.panel{background:white;border:1px solid #dce5ee;border-radius:17px;padding:19px;margin:13px 0;box-shadow:0 3px 12px #183f5c0a}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:14px 0 8px}p{line-height:1.65}.muted{color:#617487;font-size:14px}.pill{display:inline-block;background:#e7f2ff;color:#125b9f;padding:5px 10px;border-radius:30px;font-size:12px;font-weight:700}.math{font-family:ui-monospace,SFMono-Regular,monospace;background:#f1f5fa;padding:12px;border-radius:9px;overflow:auto;white-space:pre-wrap;line-height:1.7}.call{border-left:4px solid #1266c2;background:#f0f7ff;padding:12px;border-radius:7px;line-height:1.6}.good{background:#e9f8ef;border-left:4px solid #168449;padding:12px;border-radius:8px}.bad{background:#fff0ec;border-left:4px solid #c04b2b;padding:12px;border-radius:8px}.choices{display:grid;gap:9px;margin:15px 0}.choice{text-align:left;border:1px solid #d5e1ee;background:#fff}.choice:hover{border-color:#1266c2}.flex{display:flex;gap:8px;flex-wrap:wrap}.progress{height:9px;border-radius:20px;background:#e5edf5;overflow:hidden}.progress>div{height:100%;background:#168d79;transition:width .3s}.hide{display:none}input{padding:12px;border:1px solid #c9d7e6;border-radius:10px;font:inherit;width:100%;max-width:320px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.mini{padding:15px;border:1px solid #dbe6ef;border-radius:12px;background:#fbfdff}footer{padding:25px;text-align:center;color:#617487;font-size:12px}ul{line-height:1.8}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border:1px solid #dce5ee;text-align:center}th{background:#eff5fb}@media(max-width:500px){.panel{padding:15px}header{padding:20px 16px}.wrap{padding:12px}}</style></head><body><header><div style="max-width:850px;margin:auto"><span class="pill">ÖĞRENME ODAKLI · V2</span><h1>Yöneylem Öğrenme Atölyesi</h1><p>Ezberleme değil, mantığını kur. Her adımı anlayarak ilerle.</p></div></header><main class="wrap"><nav id="nav"></nav><div id="app"></div></main><footer>Kaynak: Hafta 1 Doğrusal Programlama ve Hafta 1 Soru Çözümleri · Ders notlarındaki çözüm hataları nedeniyle modeller bağımsız kontrol edilmiştir.</footer><script>
const lessons=[
{title:'Yöneylem nedir?',goal:'Bir karar probleminin neden matematiksel modele dönüştürüldüğünü anlamak.',ex:'Bir işletmenin sınırlı kaynaklarla masa ve sandalye üretmesi gerekiyor. Ne kadar üretmeli? Birden fazla seçenek olduğundan en iyi kararı arıyoruz.',concept:'Yöneylem araştırması; seçenekleri, hedefleri ve sınırlamaları sistematik olarak ele alır. Ders notlarında süreç: problemi belirle → verileri topla → modeli geliştir → çöz ve doğrula → uygula.',q:'Bir karar problemini çözmeye başlamadan önce ilk iş nedir?',a:['En iyi sonucu tahmin etmek','Problemi ve kararın ne olduğunu tanımlamak','Bütün kaynakları tüketmek'],correct:1,why:'Neyi seçtiğimizi ve hangi hedefe ulaşmak istediğimizi bilmeden doğru model kurulamaz.'},
{title:'Karar değişkeni',goal:'Sorunun “ne kadar?” kısmını değişkenle ifade etmek.',ex:'Marangozun kaç masa ve kaç sandalye üreteceğine karar vermesi gerekiyor.',concept:'x₁ = üretilecek masa sayısı, x₂ = üretilecek sandalye sayısı. Değişken bir sayı değil, henüz karar verilmemiş miktardır. Birimi de önemlidir: adet.',q:'“Bir fabrikadan ikinci bayiye gönderilecek lastik sayısı” nasıl temsil edilir?',a:['x₁₂','25 TL','Z'],correct:0,why:'xᵢⱼ gösteriminde ilk indis fabrika, ikinci indis bayi olarak tanımlanabilir.'},
{title:'Amaç fonksiyonu',goal:'Maksimum kâr ve minimum maliyet hedeflerini ayırt etmek.',ex:'Bir masa 6 TL, bir sandalye 8 TL kâr getiriyor. x₁ masa ve x₂ sandalye üretilsin.',concept:'Toplam kâr = (masa başına kâr × masa sayısı) + (sandalye başına kâr × sandalye sayısı). Bu nedenle Max Z = 6x₁ + 8x₂. ATLAS gibi taşıma problemlerinde hedef maliyeti minimum yapmak olabilir.',q:'Birim kârları 6 ve 8 TL olan iki ürün için amaç fonksiyonu nedir?',a:['Min Z = 6x₁ + 8x₂','Max Z = 6x₁ + 8x₂','Max Z = x₁ + x₂ ≤ 8'],correct:1,why:'Kârı artırmak istiyoruz; her ürünün katkısını üretim miktarıyla çarparız.'},
{title:'Kaynak kısıtları',goal:'Sınırlı kaynakları matematiksel eşitsizliğe dönüştürmek.',ex:'Bir masa 30 m, bir sandalye 20 m tahta kullanıyor. Toplam 300 m tahta var.',concept:'Kullanılan tahta = 30x₁ + 20x₂. Kullanım, eldeki miktarı geçemez. Bu nedenle 30x₁ + 20x₂ ≤ 300. “En fazla / kapasite / mevcut kaynak” ifadeleri genellikle ≤ yönünü gösterir.',q:'İki ürün sırasıyla 5 ve 10 saat iş gücü gerektiriyor. 110 saat mevcut. Doğru kısıt?',a:['5x₁ + 10x₂ ≥ 110','5x₁ + 10x₂ ≤ 110','x₁ + x₂ = 110'],correct:1,why:'Üretimde harcanan toplam saat 110 saati aşamaz.'},
{title:'Talep ve işaret kısıtları',goal:'Kapasite ile talep sınırını karıştırmamak.',ex:'BORSAN üç fabrikada büyük boy boru üretiyor. Büyük boy için toplam haftalık satış üst sınırı 800.',concept:'Büyük borular x₁₁, x₂₁ ve x₃₁ ile gösterilirse x₁₁ + x₂₁ + x₃₁ ≤ 800. Ayrıca fiziksel üretim negatif olamaz: xᵢⱼ ≥ 0.',q:'Bir üründen en fazla 600 adet satılabiliyorsa doğru ifade hangisi?',a:['Toplam üretim ≤ 600','Toplam üretim ≥ 600','Toplam üretim = 0'],correct:0,why:'“En fazla” üst sınırdır; bütün fabrikalardaki ilgili ürün miktarlarını toplarız.'},
{title:'Modeli birleştir',goal:'Karar değişkeni, amaç ve tüm kısıtları birlikte okumak.',ex:'Marangoz: masa 6 TL kâr, 30 m tahta, 5 saat iş gücü; sandalye 8 TL kâr, 20 m tahta, 10 saat iş gücü. 300 m tahta, 110 saat iş gücü.',concept:'Max Z = 6x₁ + 8x₂\n30x₁ + 20x₂ ≤ 300\n5x₁ + 10x₂ ≤ 110\nx₁, x₂ ≥ 0\n\nHer satırın farklı görevi vardır: hedef, tahta, iş gücü, işaret.',q:'Bu modelde 30x₁ + 20x₂ ≤ 300 neyi ifade eder?',a:['Toplam kârı','Tahta kullanımının üst sınırını','En az üretim miktarını'],correct:1,why:'30 ve 20 ürün başına tahta kullanımı, 300 mevcut toplam tahtadır.'}
];
const steps=[
{title:'1. Karar ne?',story:'Bir marangoz masa ve sandalye üretiyor. Her masadan 6 TL, her sandalyeden 8 TL kâr ediyor. 300 m tahta ve 110 saat iş gücü var.',question:'Bu problemde karar verdiğimiz şey nedir?',choices:['Kaç masa ve sandalye üretileceği','Tahtanın fiyatı','Geçmiş satışlar'],correct:0,why:'Karar değişkenleri, yönetimin seçebileceği üretim miktarlarıdır.'},
{title:'2. Değişkenleri tanımla',story:'x₁ masa sayısını, x₂ sandalye sayısını göstersin.',question:'x₂ = 4 ne demektir?',choices:['4 TL kâr','4 sandalye üretmek','4 metre tahta'],correct:1,why:'x₂ sandalye miktarı olarak tanımlandığı için birimi adettir.'},
{title:'3. Hedefi oluştur',story:'Masa başına 6 TL, sandalye başına 8 TL kâr var.',question:'Doğru amaç fonksiyonu hangisi?',choices:['Max Z = 6x₁ + 8x₂','Min Z = 6x₁ + 8x₂','Max Z = 30x₁ + 20x₂'],correct:0,why:'Toplam kârı maksimum yapmak istiyoruz; 30 ve 20 tahta katsayılarıdır.'},
{title:'4. Tahta kısıtını yaz',story:'Masa 30 m, sandalye 20 m tahta tüketiyor. En fazla 300 m var.',question:'Hangi eşitsizlik doğru?',choices:['30x₁ + 20x₂ ≥ 300','30x₁ + 20x₂ ≤ 300','6x₁ + 8x₂ ≤ 300'],correct:1,why:'Tahta tüketimi 300 m sınırını aşamaz.'},
{title:'5. İş gücünü yaz',story:'Masa 5 saat, sandalye 10 saat sürüyor. En fazla 110 saat çalışılabilir.',question:'Hangi kısıt doğru?',choices:['5x₁ + 10x₂ ≤ 110','5x₁ + 10x₂ ≥ 110','x₁ + x₂ ≤ 110'],correct:0,why:'Her ürünün iş gücü katsayısını miktarıyla çarpar ve toplarız.'},
{title:'6. Modeli tamamla',story:'Üretim miktarları gerçek, negatif olmayan adetlerdir.',question:'Hangi koşul eklenmeli?',choices:['x₁,x₂ ≤ 0','x₁,x₂ ≥ 0','Z = 0'],correct:1,why:'Negatif sayıda ürün üretilemez. Tam sayı gerekliliği ayrıca belirtilirse tamsayılı model kullanılır.'}
];
const $=id=>document.getElementById(id);let tab='basla',li=0,stage=0,feedback=null,lessonFeedback=null,practice=null,practiceFeedback=null;let saved=JSON.parse(localStorage.getItem('orLearnV2')||'{}');saved.done??=[];saved.guided??=0;function store(){localStorage.setItem('orLearnV2',JSON.stringify(saved))}function btn(s,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${s}</button>`}function nav(){let tabs=[['basla','Başlangıç'],['ders','Konu öğren'],['rehber','Birlikte çöz'],['pratik','Yeni soru üret'],['ornek','BORSAN & ATLAS']];$('nav').innerHTML=tabs.map(([id,name])=>`<button class="tab ${tab===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('')}function go(t){tab=t;feedback=null;lessonFeedback=null;nav();render();window.scrollTo(0,0)}function render(){if(tab==='basla')home();if(tab==='ders')showLesson();if(tab==='rehber')guided();if(tab==='pratik')showPractice();if(tab==='ornek')examples()}
function home(){$('app').innerHTML=`<section class="panel"><span class="pill">ÖĞRENME YOLCULUĞUN</span><h2>Bir modeli kendin kurabilecek misin?</h2><p>Bu uygulama soruların cevaplarını ezberletmek için değil, <b>bir problem metnini matematiksel modele dönüştürmeyi öğretmek</b> için tasarlandı.</p><div class="progress"><div style="width:${saved.done.length/lessons.length*100}%"></div></div><p class="muted">${saved.done.length}/${lessons.length} konu tamamlandı · Rehberli çözüm: ${saved.guided}/6 adım</p><div class="grid"><div class="mini"><h3>1 · Anla</h3><p>Her kavramı küçük bir örnekle öğren.</p>${btn('Konuya başla',"go('ders')",'primary')}</div><div class="mini"><h3>2 · Uygula</h3><p>Bir marangoz problemini birlikte kur.</p>${btn('Birlikte çöz',"go('rehber')",'primary')}</div><div class="mini"><h3>3 · Aktar</h3><p>Rakamları değişen yeni sorular çöz.</p>${btn('Pratik yap',"go('pratik')",'primary')}</div></div></section><section class="panel"><h3>Öğrenme sırası neden böyle?</h3><p>Önce <b>hangi kararı verdiğini</b> belirle; sonra <b>neyi iyileştirdiğini</b> söyle; en son <b>hangi kaynakların seni sınırladığını</b> yaz. Modelin bütün parçaları bu mantıktan çıkar.</p></section>`}
function showLesson(){let l=lessons[li];$('app').innerHTML=`<section class="panel"><div class="flex" style="justify-content:space-between;align-items:center"><span class="pill">DERS ${li+1} / ${lessons.length}</span><span class="muted">${saved.done.includes(li)?'✓ Öğrenildi':'Henüz tamamlanmadı'}</span></div><h2 style="margin-top:12px">${l.title}</h2><p><b>Hedef:</b> ${l.goal}</p><div class="call"><b>Örnek durum</b><p>${l.ex}</p></div><h3>Mantığı kavra</h3><div class="math">${l.concept}</div><h3>Şimdi düşün</h3><p>${l.q}</p><div class="choices">${l.a.map((x,i)=>`<button class="choice" onclick="answerLesson(${i})">${String.fromCharCode(65+i)} · ${x}</button>`).join('')}</div><div id="lf">${lessonFeedback===null?'':`<div class="${lessonFeedback===l.correct?'good':'bad'}"><b>${lessonFeedback===l.correct?'Doğru!':'Bir daha düşün.'}</b><p>${l.why}</p></div>`}</div><div class="flex" style="margin-top:15px">${btn('← Önceki', 'prevLesson()', '',)}${btn(li===lessons.length-1?'İlk derse dön':'Sonraki ders →','nextLesson()','primary')}</div></section>`}function answerLesson(i){lessonFeedback=i;if(i===lessons[li].correct&&!saved.done.includes(li)){saved.done.push(li);store()}showLesson()}function prevLesson(){li=Math.max(0,li-1);lessonFeedback=null;showLesson()}function nextLesson(){li=(li+1)%lessons.length;lessonFeedback=null;showLesson()}
function guided(){let s=steps[stage];$('app').innerHTML=`<section class="panel"><span class="pill">BİRLİKTE MODEL KUR · ${stage+1}/6</span><h2 style="margin-top:12px">${s.title}</h2><div class="progress"><div style="width:${(stage+1)/6*100}%"></div></div><div class="call" style="margin-top:16px">${s.story}</div><h3>${s.question}</h3><div class="choices">${s.choices.map((c,i)=>`<button class="choice" onclick="answerStep(${i})">${String.fromCharCode(65+i)} · ${c}</button>`).join('')}</div>${feedback===null?'':`<div class="${feedback===s.correct?'good':'bad'}"><b>${feedback===s.correct?'Doğru adım!':'Bu adımda hata var.'}</b><p>${s.why}</p></div>`}<div class="flex" style="margin-top:16px">${btn('← Geri','backStep()')}${btn(stage===5?'Baştan çöz':'Sonraki adım →','nextStep()','primary')}</div></section>`}function answerStep(i){feedback=i;if(i===steps[stage].correct){saved.guided=Math.max(saved.guided,stage+1);store()}guided()}function nextStep(){if(feedback!==steps[stage].correct){alert('İlerlemeden önce doğru seçeneği bul. Açıklamayı kullanabilirsin.');return}stage=(stage+1)%6;feedback=null;guided()}function backStep(){stage=Math.max(0,stage-1);feedback=null;guided()}
function makePractice(){let kind=Math.floor(Math.random()*4),a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8),cap=20+Math.floor(Math.random()*12)*10,profit=3+Math.floor(Math.random()*9),profit2=3+Math.floor(Math.random()*9);if(kind===0)return {title:'Amaç fonksiyonu',story:`Bir atölyede A ürününün birim kârı ${profit} TL, B ürününün birim kârı ${profit2} TL. x₁ A, x₂ B üretim miktarı.`,q:'Kârı en yüksek yapmak için doğru fonksiyon?',choices:[`Max Z = ${profit}x₁ + ${profit2}x₂`,`Min Z = ${profit}x₁ + ${profit2}x₂`,`Max Z = x₁ + x₂`],correct:0,why:'Kâr en yüksek yapılır: her ürünün birim kârı × üretim miktarı.'};if(kind===1)return {title:'Kapasite kısıtı',story:`A ürünü ${a} saat, B ürünü ${b} saat iş gücü gerektiriyor. Toplam ${cap} saat mevcut.`,q:'İş gücü kısıtını seç.',choices:[`${a}x₁ + ${b}x₂ ≥ ${cap}`,`${a}x₁ + ${b}x₂ ≤ ${cap}`,`x₁ + x₂ = ${cap}`],correct:1,why:'Toplam kullanılan iş gücü mevcut kapasiteyi aşamaz.'};if(kind===2)return {title:'Asgari gereksinim',story:`İki kaynaktan gelen toplam malzeme en az ${cap} birim olmalı. x₁ ve x₂ gelen miktarlar.`,q:'Gereksinim kısıtı hangisi?',choices:[`x₁ + x₂ ≤ ${cap}`,`x₁ + x₂ = 0`,`x₁ + x₂ ≥ ${cap}`],correct:2,why:'“En az” bir alt sınırdır; toplam gereksinimden az olamaz.'};return {title:'Talep sınırı',story:`Üç fabrikada üretilen küçük borular sırasıyla x₁₃, x₂₃, x₃₃ ile gösteriliyor. Toplam en fazla ${cap} küçük boru satılabiliyor.`,q:'Doğru talep kısıtı?',choices:[`x₁₃ + x₂₃ + x₃₃ ≤ ${cap}`,`x₃₁ + x₃₂ + x₃₃ ≤ ${cap}`,`x₁₃ + x₂₃ + x₃₃ ≥ ${cap}`],correct:0,why:'Sabit ürün (üçüncü sütun) tüm fabrikalar üzerinden toplanır. “En fazla” ≤ demektir.'}}
function showPractice(){if(!practice)practice=makePractice();$('app').innerHTML=`<section class="panel"><span class="pill">EZBERİ KIR · RASTGELE VERİLER</span><h2 style="margin-top:12px">${practice.title}</h2><p>Her yeni soruda sayılar veya problem türü değişir. Önce metinden <b>neyin sınırlandığını</b> bul.</p><div class="call">${practice.story}</div><h3>${practice.q}</h3><div class="choices">${practice.choices.map((c,i)=>`<button class="choice" onclick="answerPractice(${i})">${String.fromCharCode(65+i)} · ${c}</button>`).join('')}</div>${practiceFeedback===null?'':`<div class="${practiceFeedback===practice.correct?'good':'bad'}"><b>${practiceFeedback===practice.correct?'Doğru mantık!':'Tekrar incele.'}</b><p>${practice.why}</p></div>`}<div class="flex" style="margin-top:16px">${btn('Yeni problem üret','newPractice()','primary')}</div></section>`}function answerPractice(i){practiceFeedback=i;showPractice()}function newPractice(){practice=makePractice();practiceFeedback=null;showPractice()}
function examples(){$('app').innerHTML=`<section class="panel"><span class="pill">DERS NOTLARINDAN</span><h2 style="margin-top:12px">BORSAN: 3 fabrika × 3 boru tipi</h2><p>Her fabrikada büyük, orta ve küçük boru üretiliyor. <b>xᵢⱼ</b> = i. fabrikada üretilen j. boy boru miktarı (j=1 büyük, 2 orta, 3 küçük).</p><h3>1 · Neyi artırıyoruz?</h3><p>Büyük boru 800 TL, orta 600 TL, küçük 540 TL kâr getiriyor. Fabrika hangisi olursa olsun aynı boy borunun birim kârı aynı.</p><div class="math">Max Z = 800(x₁₁+x₂₁+x₃₁) + 600(x₁₂+x₂₂+x₃₂) + 540(x₁₃+x₂₃+x₃₃)</div><h3>2 · Fabrika üretim kapasitesi</h3><div class="math">x₁₁+x₁₂+x₁₃ ≤ 800\nx₂₁+x₂₂+x₂₃ ≤ 650\nx₃₁+x₃₂+x₃₃ ≤ 450</div><p><b>Neden satır?</b> Çünkü aynı fabrikanın bütün ürünlerini topluyoruz.</p><h3>3 · Stok alanı</h3><div class="math">2.5x₁₁+2x₁₂+1.5x₁₃ ≤ 1400\n2.5x₂₁+2x₂₂+1.5x₂₃ ≤ 1250\n2.5x₃₁+2x₃₂+1.5x₃₃ ≤ 800</div><p><b>Neden katsayılar farklı?</b> Boru boylarına göre kaplanan alan değişiyor.</p><h3>4 · Satış sınırı</h3><div class="math">x₁₁+x₂₁+x₃₁ ≤ 800\nx₁₂+x₂₂+x₃₂ ≤ 900\nx₁₃+x₂₃+x₃₃ ≤ 600\nxᵢⱼ ≥ 0</div><p><b>Neden sütun?</b> Aynı boy boruyu üreten bütün fabrikaları topluyoruz.</p></section><section class="panel"><span class="pill">ULAŞTIRMA MODELİ</span><h2 style="margin-top:12px">ATLAS Lastik: 3 fabrika × 4 bayi</h2><p><b>xᵢⱼ</b> = i. fabrikadan j. bayiye gönderilen lastik sayısı. Burada hedef kârı artırmak değil, <b>taşıma maliyetini azaltmak</b>.</p><table><tr><th>Fabrika</th><th>Bayi 1</th><th>Bayi 2</th><th>Bayi 3</th><th>Bayi 4</th></tr><tr><th>A</th><td>25</td><td>38</td><td>30</td><td>19</td></tr><tr><th>B</th><td>22</td><td>34</td><td>18</td><td>36</td></tr><tr><th>C</th><td>35</td><td>15</td><td>15</td><td>32</td></tr></table><h3>Amaç fonksiyonu</h3><div class="math">Min Z = 25x₁₁+38x₁₂+30x₁₃+19x₁₄\n       +22x₂₁+34x₂₂+18x₂₃+36x₂₄\n       +35x₃₁+15x₃₂+15x₃₃+32x₃₄</div><h3>Fabrika kapasitesi</h3><div class="math">x₁₁+x₁₂+x₁₃+x₁₄ ≤ 380000\nx₂₁+x₂₂+x₂₃+x₂₄ ≤ 220000\nx₃₁+x₃₂+x₃₃+x₃₄ ≤ 350000</div><h3>Bayi talepleri</h3><div class="math">x₁₁+x₂₁+x₃₁ = 180000\nx₁₂+x₂₂+x₃₂ = 250000\nx₁₃+x₂₃+x₃₃ = 340000\nx₁₄+x₂₄+x₃₄ = 150000\nxᵢⱼ ≥ 0</div><p class="muted">Bu modelde bayi taleplerinin eksiksiz karşılanması varsayılmıştır. Toplam kapasite 950.000, toplam talep 920.000 olduğu için fabrika kapasiteleri eşitlik değil üst sınırdır.</p><div class="call"><b>Akılda tut:</b> Fabrika kapasitesi için <b>satırları</b>, bayi talebi için <b>sütunları</b> toplarsın. Bu bir ezber kuralı değil, indislerin anlamından çıkan sonuçtur.</div></section>`}
